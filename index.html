<!doctype html>
<html lang="es" data-theme="oscuro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04040C">
<title>FORKY</title>
<meta name="description" content="Registro de entreno de fuerza: pesos por máquina, descansos, sesiones y progreso.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preload" href="fonts/orbitron-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/rajdhani-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/forky.css">
<script>
  // Pinta el tema guardado antes de cargar nada, para no ver un parpadeo
  try { var t = localStorage.getItem("forky:tema"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
<!-- Mismo dibujo que logoCarga() en js/icons.js -->
<div class="cargando" role="status"><svg width="120" height="120" viewBox="0 0 240 240" aria-hidden="true" class="logo-carga">
  <defs><linearGradient id="axg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2E8BFF"/><stop offset="0.55" stop-color="#6A4BE0"/><stop offset="1" stop-color="#FF2E4D"/></linearGradient></defs>
  <path class="giro" d="M120 14 L212 67 L212 173 L120 226 L28 173 L28 67 Z" fill="none" stroke="url(#axg)" stroke-width="10" stroke-linejoin="round" stroke-dasharray="60 30" opacity="0.7"/>
  <path class="trazo" d="M88 178 V68 H160 M88 124 H148" fill="none" stroke="url(#axg)" stroke-width="20" stroke-linecap="square"/>
</svg><span class="sr-only">Cargando FORKY</span></div>
<noscript><p style="padding:24px">FORKY necesita JavaScript.</p></noscript>
<script>
  // Si hay una versión nueva ya descargada, se aplica al abrir la app.
  if ("serviceWorker" in navigator && location.search.indexOf("local") < 0) {
    var fkRecarga = false, fkHabia = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener("controllerchange", function () { if (fkHabia && !fkRecarga) { fkRecarga = true; location.reload(); } });
    navigator.serviceWorker.getRegistration().then(function (r) {
      if (r && r.waiting && navigator.serviceWorker.controller) r.waiting.postMessage("activar");
    }).catch(function () {});
  }
</script>
<script type="module" src="js/app.js"></script>
</body>
</html>
